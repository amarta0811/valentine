<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Will You Be My Valentine?</title>
    <style>
        body { text-align: center; font-family: 'Arial', sans-serif; background-color: #ffeef2; padding-top: 50px; }
        .container { background: white; padding: 50px; border-radius: 20px; display: inline-block; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        h1 { color: #d63384; }
        .buttons { margin-top: 30px; position: relative; height: 100px; }
        button { padding: 15px 30px; font-size: 18px; border-radius: 10px; border: none; cursor: pointer; transition: 0.3s; }
        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #6c757d; color: white; position: absolute; }
    </style>
</head>
<body>

<div class="container" id="mainCard">
    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueG53bm53bm53bm53bm53bm53bm53bm53bm53bm53bm53&ep=v1_gifs_search&rid=giphy.gif&ct=s" width="150" alt="Cute Cat">
    <h1>Will you be my Valentine?</h1>
    <div class="buttons">
        <button id="yesBtn" onclick="celebrate()">Yes</button>
        <button id="noBtn" onmouseover="moveButton()">No</button>
    </div>
</div>

<script>
    function moveButton() {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 100);
        document.getElementById('noBtn').style.left = x + 'px';
        document.getElementById('noBtn').style.top = y + 'px';
    }

    function celebrate() {
        document.getElementById('mainCard').innerHTML = "<h1>YAY! ❤️ See you then!</h1><img src='https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueG53bm53bm53bm53bm53bm53bm53bm53bm53bm53bm53&ep=v1_gifs_search&rid=giphy.gif&ct=g' width='300'>";
    }
</script>

</body>
</html>
